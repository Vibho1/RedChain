[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redchain"
version = "0.1.0"
description = "Autonomous multi-turn red-teaming engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-security", "red-teaming", "llm", "agents", "owasp"]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "httpx>=0.27",
    "sqlmodel>=0.0.19",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
redchain = "redchain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["redchain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"